name: Publish Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-expo-token:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.token.outputs.configured }}
    steps:
      - id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-publish:
    needs: check-expo-token
    if: github.actor != 'github-actions[bot]' && needs.check-expo-token.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Quality gate
        run: |
          npm run type-check
          npm run build
          npx wrangler pages functions build functions --outdir .wrangler/functions-build
          node scripts/navigationSimulation.mjs

      - name: Build the installable APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json

      - name: Download and identify the verified APK
        id: apk
        run: |
          APK_URL="$(node -e "const raw=require('./build.json'); const build=Array.isArray(raw)?raw[0]:raw; process.stdout.write(build.artifacts.buildUrl)")"
          BUILD_VERSION="$(node -e "const raw=require('./build.json'); const build=Array.isArray(raw)?raw[0]:raw; process.stdout.write(String(build.appBuildVersion || 'unknown'))")"
          APP_VERSION="$(node -e "const app=require('./app.json'); process.stdout.write(app.expo.version)")"
          curl --fail --location --retry 3 "$APK_URL" --output apex-ugr.apk
          test -s apex-ugr.apk
          sha256sum apex-ugr.apk
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish immutable release with stable latest asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-v${{ steps.apk.outputs.app_version }}-b${{ steps.apk.outputs.build_version }}-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" apex-ugr.apk#apex-ugr.apk \
            --title "Apex UGR Android ${{ steps.apk.outputs.app_version }} (${{ steps.apk.outputs.build_version }})" \
            --notes "Commit: ${GITHUB_SHA}\nBuild date: $(date -u +%Y-%m-%dT%H:%M:%SZ)\nSource: ${GITHUB_REPOSITORY}@${GITHUB_SHA}" \
            --latest
